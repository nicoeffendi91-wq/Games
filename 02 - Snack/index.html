<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Sederhana</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #1d2a22; color: #e9f1ea; min-height: 100vh; }
  #game { background: #121c16; border: 4px solid #3f5a48; border-radius: 6px; max-width: 100%; height: auto; touch-action: none; }
  .panel { background: #28382e; border-radius: 8px; }
  .stat { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="container py-4">
  <h1 class="h3 text-center mb-4">Snake</h1>
  <div class="row justify-content-center g-4">
    <div class="col-auto">
      <canvas id="game" width="400" height="400"></canvas>
    </div>
    <div class="col-12 col-md-4 col-lg-3">
      <div class="panel p-3 mb-3">
        <div class="d-flex justify-content-between">
          <div><div class="text-secondary">Skor</div><div id="score" class="h3 stat">0</div></div>
          <div class="text-end"><div class="text-secondary">Tertinggi</div><div id="best" class="h3 stat">0</div></div>
        </div>
      </div>
      <div class="panel p-3 mb-3">
        <label for="speed" class="form-label text-secondary">Kecepatan</label>
        <select id="speed" class="form-select">
          <option value="150">Lambat</option>
          <option value="110" selected>Sedang</option>
          <option value="75">Cepat</option>
        </select>
      </div>
      <div class="d-grid gap-2 mb-3">
        <button id="startBtn" class="btn btn-success">Mulai</button>
        <button id="pauseBtn" class="btn btn-outline-light" disabled>Jeda</button>
      </div>
      <div class="panel p-3 small">
        <div class="fw-semibold mb-2">Kontrol</div>
        <div>Panah atau W A S D : arah</div>
        <div>Spasi : jeda</div>
      </div>
      <div class="d-md-none mt-3">
        <div class="d-flex justify-content-center mb-2"><button class="btn btn-secondary px-4" data-dir="up">↑</button></div>
        <div class="d-flex justify-content-center gap-2">
          <button class="btn btn-secondary px-4" data-dir="left">←</button>
          <button class="btn btn-secondary px-4" data-dir="down">↓</button>
          <button class="btn btn-secondary px-4" data-dir="right">→</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="overModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content bg-dark text-light text-center">
      <div class="modal-body p-4">
        <h2 class="h4">Game selesai</h2>
        <p>Skor akhir: <strong id="finalScore">0</strong></p>
        <button class="btn btn-success" id="againBtn" data-bs-dismiss="modal">Main lagi</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = 20, N = canvas.width / CELL;

let snake, dir, nextDir, food, score, best = 0, timer, running = false, paused = false;

const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function setDir(name) {
  const d = DIRS[name];
  // cegah berbalik arah 180 derajat
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (snake.length === N * N) return gameOver();
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#14201a' : '#101a15';
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  if (!food) return;
  // makanan
  ctx.fillStyle = '#e8564f';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  // ular
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#8be28b' : '#4cb86a';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
  // mata
  const h = snake[0];
  ctx.fillStyle = '#10201a';
  const ex = dir.x === 0 ? [5, 13] : [dir.x > 0 ? 13 : 5, dir.x > 0 ? 13 : 5];
  const ey = dir.y === 0 ? [5, 13] : [dir.y > 0 ? 13 : 5, dir.y > 0 ? 13 : 5];
  for (let i = 0; i < 2; i++) ctx.fillRect(h.x * CELL + ex[i], h.y * CELL + ey[i], 3, 3);
}

function start() {
  clearInterval(timer);
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = DIRS.right; nextDir = DIRS.right;
  score = 0; running = true; paused = false;
  document.getElementById('score').textContent = 0;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('pauseBtn').textContent = 'Jeda';
  document.getElementById('startBtn').textContent = 'Ulangi';
  placeFood();
  draw();
  timer = setInterval(step, +document.getElementById('speed').value);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Lanjut' : 'Jeda';
  if (paused) {
    clearInterval(timer);
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Dijeda', canvas.width / 2, canvas.height / 2);
  } else {
    timer = setInterval(step, +document.getElementById('speed').value);
  }
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) { best = score; document.getElementById('best').textContent = best; }
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('finalScore').textContent = score;
  new bootstrap.Modal(document.getElementById('overModal')).show();
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
  if (map[e.key]) { e.preventDefault(); if (running && !paused) setDir(map[e.key]); }
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
});

document.querySelectorAll('[data-dir]').forEach(b =>
  b.addEventListener('click', () => { if (running && !paused) setDir(b.dataset.dir); }));

// geser jari di canvas (ponsel)
let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  if (!running || paused) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('speed').addEventListener('change', () => { if (running && !paused) start(); });

snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir = DIRS.right; food = null;
draw();
</script>
</body>
</html>
